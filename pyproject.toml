[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-env"
version = "1.0.0"
description = "SRE Incident Response Simulator — OpenEnv compliant"
requires-python = ">=3.11"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.1",
    "openai>=2.7.2",           # ← Upgraded to satisfy openenv-core
    "requests>=2.32.3",
    "httpx>=0.27.0",
]

[project.scripts]
server = "server.app:app"
inference = "inference:main"