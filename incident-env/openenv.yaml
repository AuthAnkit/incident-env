name: incident-env
version: "1.0.0"
description: >
  IncidentEnv: SRE Incident Response Simulator.
  An AI agent must diagnose and resolve production incidents from realistic
  alerts, metrics, logs, and deployment history — using the OpenEnv
  step()/reset()/state() API.
  Three tasks with escalating difficulty: Redis OOM (easy), database
  connection pool exhaustion (medium), and cascading auth-service memory
  leak with multiple red herrings (hard).

author: "your-hf-username"
license: Apache-2.0
tags:
  - openenv
  - sre
  - incident-response
  - real-world
  - agentic
  - reward-shaping
  - red-herrings

tasks:
  - id: task_easy
    name: "Redis Cache Out-of-Memory"
    difficulty: easy
    max_steps: 12
    requires_postmortem: false

  - id: task_medium
    name: "Database Connection Pool Exhaustion"
    difficulty: medium
    max_steps: 18
    requires_postmortem: false

  - id: task_hard
    name: "Auth Service Memory Leak with Cascading Failures"
    difficulty: hard
    max_steps: 22
    requires_postmortem: true

observation_space:
  type: object
  description: "Everything the agent sees at each step."
  fields:
    active_alerts:
      type: "list[Alert]"
      description: "Currently firing monitoring alerts."
    service_metrics:
      type: "dict[str, ServiceMetrics]"
      description: "Real-time telemetry per service (CPU, memory, error_rate, latency)."
    recent_logs:
      type: "list[LogEntry]"
      description: "Most recent structured log lines (newest last)."
    recent_deployments:
      type: "list[DeploymentRecord]"
      description: "Deployments in the last 24h with changelogs."
    available_diagnostics:
      type: "list[str]"
      description: "Tool names callable via run_diagnostic."
    available_fixes:
      type: "list[str]"
      description: "Remediation names callable via apply_fix."
    incident_history:
      type: "list[IncidentHistoryEntry]"
      description: "All agent actions taken this episode."
    runbook_hints:
      type: "list[RunbookHint]"
      description: "Optional contextual runbook hints from alert patterns."
    time_elapsed_minutes:
      type: float
      description: "Simulated time since incident opened."
    incident_status:
      type: string
      enum: [open, investigating, mitigating, mitigated, resolved]
    task_id:
      type: string
    step_number:
      type: integer
    max_steps:
      type: integer

action_space:
  type: object
  fields:
    action_type:
      type: string
      enum: [run_diagnostic, apply_fix, write_postmortem, close_incident, escalate, add_note]
      required: true
    tool:
      type: string
      required: false
      description: "Tool name for run_diagnostic / apply_fix."
    target_service:
      type: string
      required: false
    postmortem_text:
      type: string
      required: false
      description: "Full postmortem markdown for write_postmortem."
    note:
      type: string
      required: false
    reasoning:
      type: string
      required: false
      description: "Optional chain-of-thought (not scored)."

reward:
  type: float
  range: [0.0, 1.0]
  description: >
    Partial credit at every step.
    Positive signals: correct diagnostic with new discovery (+0.05),
    root cause identified (+0.15 bonus), correct fix applied (+0.30),
    incident resolved (+0.10 bonus), good postmortem (up to +0.20).
    Negative signals: wrong fix (−0.05), repeated diagnostic (−0.02),
    duplicate fix (−0.03), step cost (−0.01/step),
    closing without resolution (−0.05).

endpoints:
  reset:  "POST /reset"
  step:   "POST /step"
  state:  "GET  /state"
  tasks:  "GET  /tasks"
  grader: "POST /grader"
  baseline: "POST /baseline"
  health: "GET  /health"
  docs:   "GET  /docs"
